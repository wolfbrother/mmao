name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,plot]"
      - name: Run tests
        run: pytest
      - name: Check Python errors and unused names
        run: ruff check --select F,E9 .
      - name: Build package
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install built wheel and verify outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y mmao-opt
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          mmao --version
          mmao continuous --dimension 3 --iterations 2 --summary-only
          mmao tsp --benchmark berlin52 --iterations 2 --summary-only
          mmao knapsack --benchmark mknap2 --iterations 2 --summary-only
          mmao dynamic --dimension 3 --iterations 2 --summary-only
          mmao classification --dataset iris --classifier knn --iterations 1 --summary-only
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
  base-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m pip check
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,io,plot]" numpy==1.24.0 scikit-learn==1.3.0 scipy==1.10.1 joblib==1.2.0 matplotlib==3.7.0
      - run: pytest
      - run: python -m pip check
